<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change password trace</title>
<link rel="stylesheet" href="../../css/brand.css">
<link rel="stylesheet" href="../../student/css/styles.css">
<link rel="stylesheet" href="../../student/css/extra.css">
<link rel="stylesheet" href="../../css/app-settings.css">
<style>
  body{margin:0;padding:22px;background:#eef2f7;font-family:'Segoe UI',Arial,sans-serif;}
  *,*::before,*::after{animation:none !important;transition:none !important;}
  table{border-collapse:collapse;width:100%;max-width:960px;font-size:13px;background:#fff;}
  th,td{border:1px solid #e2e8f0;padding:7px 9px;text-align:left;}
  th{background:#eef2f7;}
  .pass{color:#047857;font-weight:700;} .fail{color:#b91c1c;font-weight:700;}
  #sum{margin-top:14px;font-size:15px;font-weight:700;}
</style>
</head>
<body class="light-mode">
<h3 style="margin:0 0 10px;font-size:16px;">set-password.js - change-password flow</h3>
<table id="t"><thead><tr><th>#</th><th>Check</th><th>Expected</th><th>Actual</th><th></th></tr></thead><tbody></tbody></table>
<div id="sum">running...</div>

<script>
  // ---- stub Firebase + Firestore ----
  window.__updateCalls = [];
  window.__nextError = null;
  var fakeUser = {
    uid: 'u1',
    updatePassword: function (pw) {
      window.__updateCalls.push(pw);
      if (window.__nextError) { var e = window.__nextError; window.__nextError = null; return Promise.reject(e); }
      return Promise.resolve();
    }
  };
  window.firebase = {
    auth: function () { return { currentUser: fakeUser }; },
    firestore: { FieldValue: { delete: function () { return '__DELETE__'; } } }
  };
  window.auth = { currentUser: fakeUser };
  window.__merges = [];
  window.db = {
    collection: function () {
      return { doc: function () {
        return {
          get: function () { return Promise.resolve({ exists: true, data: function () { return {}; } }); },
          set: function (o) { window.__merges.push(o); return Promise.resolve(); }
        };
      } };
    }
  };
</script>
<script src="../../student/js/set-password.js"></script>
<script>
const rows = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
function check(name, expected, actual) {
  rows.push({ name, expected, actual, ok: String(expected) === String(actual) });
}
const $ = s => document.querySelector(s);

(async function run(){
  await wait(150);

  check('1. openChangePassword is exposed', 'function', typeof window.openChangePassword);

  window.openChangePassword();
  await wait(60);
  const overlay = $('.sp-overlay');
  check('2. modal opens', true, !!overlay);

  // THEME: the card must not be the old hardcoded dark
  const card = $('.sp-card');
  const cardBg = getComputedStyle(card).backgroundColor;
  check('3. card uses the light surface, not #152035', 'rgb(255, 255, 255)', cardBg);
  const scrim = getComputedStyle(overlay).backgroundColor;
  check('4. scrim is the light scrim', 'rgba(246, 248, 251, 0.7)', scrim);
  const fam = getComputedStyle(overlay).fontFamily;
  check('5. uses the app font, not DM Sans', true, /Segoe UI/.test(fam) && !/DM Sans/.test(fam));

  // VALIDATION: too short
  $('#spNew').value = 'abc'; $('#spConfirm').value = 'abc';
  $('#spSave').click(); await wait(40);
  check('6. rejects a short password', 'Password must be at least 6 characters.', $('#spErr').textContent);
  check('7. no auth call made', 0, window.__updateCalls.length);

  // VALIDATION: mismatch
  $('#spNew').value = 'abcdef1'; $('#spConfirm').value = 'abcdef2';
  $('#spSave').click(); await wait(40);
  check('8. rejects a mismatch', 'The two passwords do not match.', $('#spErr').textContent);
  check('9. still no auth call', 0, window.__updateCalls.length);

  // HAPPY PATH
  $('#spNew').value = 'newpass123'; $('#spConfirm').value = 'newpass123';
  $('#spSave').click(); await wait(120);
  check('10. calls updatePassword with the new value', 'newpass123', window.__updateCalls[0]);
  check('11. clears the mustSetPassword flag', '__DELETE__',
        (window.__merges[0] || {}).mustSetPassword);
  check('12. modal closes on success', false, !!$('.sp-overlay'));

  // REQUIRES-RECENT-LOGIN
  window.__nextError = { code: 'auth/requires-recent-login', message: 'nope' };
  window.openChangePassword(); await wait(60);
  $('#spNew').value = 'anotherpass'; $('#spConfirm').value = 'anotherpass';
  $('#spSave').click(); await wait(120);
  check('13. explains a stale session instead of dumping the raw error',
        true, /sign out and sign in again/.test($('#spErr').textContent));
  check('14. Save button is re-enabled after the failure', false, $('#spSave').disabled);

  const tb = document.querySelector('#t tbody');
  tb.innerHTML = rows.map((r,i) =>
    '<tr><td>'+(i+1)+'</td><td>'+r.name+'</td><td>'+r.expected+'</td><td>'+r.actual+
    '</td><td class="'+(r.ok?'pass">PASS':'fail">FAIL')+'</td></tr>').join('');
  const pass = rows.filter(r=>r.ok).length;
  const el = document.getElementById('sum');
  el.textContent = pass+' / '+rows.length+(pass===rows.length?'  PASS':'  FAIL');
  el.className = pass===rows.length?'pass':'fail';
  window.__pwTrace = { pass, total: rows.length, rows: rows.filter(r=>!r.ok) };
})();
</script>
</body>
</html>
