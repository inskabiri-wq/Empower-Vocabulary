<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Lingualab">
  <!-- Lingualab mark: a flask with a liquid fill.
       From the Claude Design "LinguaLab Loaders v4" hand-off, recoloured to
       this app's palette:
         body / cap  #16264a (design navy)  ->  #1e3a8a  blue-900, the app's
                     deepest blue. Same value as the original navy, so the mark
                     keeps its weight, but it reads as part of a blue app.
         liquid      #a4123c (design crimson) -> #ee3342, the FSMVU crimson the
                     app already carries. That is "the colour we have".
       Sized for a white ground, which is the app default. -->
  <defs>
    <clipPath id="ll-flask">
      <path d="M40,10 H60 V36 L86,80 c2.4,4.2 -0.6,9 -5.4,9 H36 l-11,11 V89 H19.4 c-4.8,0 -7.8,-4.8 -5.4,-9 L40,36 Z"/>
    </clipPath>
  </defs>
  <path d="M40,10 H60 V36 L86,80 c2.4,4.2 -0.6,9 -5.4,9 H36 l-11,11 V89 H19.4 c-4.8,0 -7.8,-4.8 -5.4,-9 L40,36 Z" fill="#1e3a8a"/>
  <g clip-path="url(#ll-flask)"><rect x="0" y="66" width="100" height="34" fill="#ee3342"/></g>
  <rect x="34" y="7" width="32" height="7" rx="3.5" fill="#1e3a8a"/>
</svg>
