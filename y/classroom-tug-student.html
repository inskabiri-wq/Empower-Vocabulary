<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tug of War | Lingualab</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono&display=swap" rel="stylesheet">
<!-- Brand-wide reset - must load FIRST so per-page styles win conflicts. -->
<link rel="stylesheet" href="css/brand.css">
<!-- UNIVERSAL classroom look; the game only adds its own widgets. -->
<link rel="stylesheet" href="classroom/css/styles.css">
<link rel="stylesheet" href="classroom/css/minigames.css?v=3">
</head>
<body class="tug">

<!-- Animated Background - same as every classroom page -->
<div class="gradient-bg"></div>
<div class="floating-shapes">
  <div class="shape shape-1"></div>
  <div class="shape shape-2"></div>
  <div class="shape shape-3"></div>
  <div class="shape shape-4"></div>
</div>

<!-- Music Control -->
<div class="music-control">
  <button class="music-btn" id="musicBtn" onclick="toggleMusic()">🎵</button>
  <button class="music-btn" onclick="nextTrack()" title="Next Track">🎶</button>
  <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="30" onchange="setVolume(this.value)">
</div>
<audio id="bgMusic" preload="none"></audio>

<!-- Header -->
<header class="header">
  <div class="header-title">
    <span style="font-size: 1.5rem;">🪢</span>
    <h1>Tug of War</h1>
  </div>
  <div class="header-actions">
    <span style="color: var(--text-secondary); font-weight: 600;">💪 <span id="myScore">0</span></span>
  </div>
</header>

<!-- Join - same shape as the Classroom Mode join screen -->
<div id="view-join" class="lobby-container">
  <div class="lobby-icon">🪢</div>
  <h1 class="lobby-title">Join the Game</h1>
  <p class="lobby-subtitle">Enter the session code from your teacher</p>

  <div class="card" style="max-width: 400px; margin: 24px auto;">
    <div class="form-group">
      <label class="form-label">Session Code</label>
      <input type="text" id="codeInput" class="form-input code-input" maxlength="5" placeholder="ABCDE" autocomplete="off">
    </div>
    <div class="form-group">
      <label class="form-label">Your Name</label>
      <input type="text" id="nameInput" class="form-input" maxlength="24" placeholder="e.g. Alex" autocomplete="off">
    </div>
    <button id="joinBtn" class="btn btn-primary btn-large" style="width: 100%;">🎟️ Join Game</button>
  </div>
</div>

<!-- Wait -->
<div id="view-wait" class="lobby-container" style="display: none;">
  <div class="lobby-icon">⏳</div>
  <h1 class="lobby-title">You're In!</h1>
  <p class="lobby-subtitle">Waiting for the teacher to start the game...</p>

  <div class="card" style="max-width: 400px; margin: 24px auto; text-align: center;">
    <div id="teamPill" style="margin-bottom: 12px;"></div>
    <p style="color: var(--text-secondary); font-size: 0.9rem;">Every correct answer pulls the rope for your team.</p>
    <div class="waiting-animation">
      <div class="waiting-dot"></div>
      <div class="waiting-dot"></div>
      <div class="waiting-dot"></div>
    </div>
  </div>
</div>

<!-- Play -->
<div id="view-play" class="container" style="display: none;">
  <div class="card" id="teamBar" style="padding: 16px 20px; margin-bottom: 16px;">
    <div class="tug-teams" style="font-size: 0.95rem;">
      <span class="red">🔴 <span id="miniRed">0</span></span>
      <span class="blue"><span id="miniBlue">0</span> 🔵</span>
    </div>
    <div class="tug-track" style="height: 26px;">
      <div class="tug-center-line"></div>
      <div class="tug-knot" id="miniKnot" style="font-size: 1.3em;">🪢</div>
    </div>
  </div>
  <div class="card">
    <div class="mg-stem" id="stem">Loading...</div>
    <div class="mg-opts" id="opts"></div>
    <div class="mg-feedback" id="feedback"></div>
  </div>
</div>

<!-- Done -->
<div id="view-done" class="container" style="display: none;">
  <div class="card" style="max-width: 640px; margin: 0 auto; text-align: center;">
    <h2 class="card-title" style="justify-content: center; font-size: 1.5rem;">🏁 Game Over!</h2>
    <div class="mg-banner" id="doneBanner"></div>
    <p style="color: var(--text-secondary);" id="doneMine"></p>
    <h3 style="margin: 20px 0 12px;">📊 Leaderboard</h3>
    <div class="leaderboard-list" id="doneList" style="text-align: left;"></div>
    <div style="display: flex; gap: 12px; margin-top: 24px; flex-wrap: wrap;">
      <a href="classroom-student.html" class="btn btn-secondary btn-large" style="flex: 1;">➕ Join Another Game</a>
      <a href="student-dashboard.html" class="btn btn-primary btn-large" style="flex: 1;">← Back to Dashboard</a>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="classroom/js/refresh-guard.js"></script>
<script src="classroom/js/minigame-core.js?v=3"></script>
<script src="classroom/js/tug-student.js?v=3"></script>

</body>
</html>
