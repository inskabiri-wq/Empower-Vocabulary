<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Courses | Lingualab</title>
<link rel="icon" type="image/svg+xml" href="/lingualab-mark.svg">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="css/brand.css?v=30">
<link rel="stylesheet" href="css/fsmvu-loader.css?v=14">
<link rel="stylesheet" href="student/css/policy-course.css?v=15">
<script src="js/app-dialog.js?v=8"></script>
  <script src="js/sound.js?v=4"></script>
<style>
  /* Catalog-only additions on top of policy-course.css */
  .crs-card { align-items: flex-start; }
  .crs-desc { font-size: 0.88em; color: #94a3b8; line-height: 1.55; margin-top: 4px; }
  .crs-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 150px; }
  .crs-state { font-size: 0.8em; font-weight: 800; padding: 4px 12px; border-radius: 999px; }
  .crs-state.on  { color: #34d399; background: rgba(16,185,129,0.12); }
  .crs-state.off { color: #94a3b8; background: rgba(148,163,184,0.12); }
  .crs-state.done { color: #f5c842; background: rgba(245,200,66,0.12); }
  @media (max-width: 560px) {
    .crs-card { flex-wrap: wrap; }
    .crs-right { width: 100%; align-items: stretch; text-align: center; }
    .crs-right .pc-btn { display: block; width: 100%; text-align: center; box-sizing: border-box; }
    .crs-state { text-align: center; }
  }

/* LIGHT MODE - see the note in join.html. */
.light-mode .cs-hero, .light-mode .cs-card { box-shadow: 0 18px 40px rgba(15,23,42,0.07); }
</style>
  <!-- Shared display settings (text size + line spacing), app-wide.
       In <head> so the saved size applies before first paint. -->
  <link rel="stylesheet" href="css/app-settings.css?v=55">
  <script src="js/app-settings.js?v=40"></script>
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>

<div id="crsLoading" class="pc-center-fill">
  <div class="fsmvu-loader fsmvu-loader--progress fsmvu-loader--white" role="status" aria-label="Loading">
    <div class="fsmvu-ring-wrap"><span class="fsmvu-track"></span><span class="fsmvu-arc"></span><span class="fsmvu-seal"></span></div>
  </div>
</div>

<div id="crsApp" style="display:none;">
  <header class="pc-header">
    <button type="button" id="crsDashExit" class="pc-back ll-navbtn">&#8592; Dashboard</button>
    <div class="pc-header-title">
      <span class="pc-header-icon">🎓</span>
      <span>Courses</span>
    </div>
    <div class="pc-header-right">
      <!-- Hidden: the profile badge already shows the name, and the two together
           read as the name printed twice. The element stays because courses.html
           writes into it by id on load. -->
      <span class="pc-student-chip" id="crsStudentChip" hidden style="display:none"></span>
    </div>
    <!-- DIRECT child of the header, not inside .pc-header-right. Nested, its
         margin-left:auto only pushed it within that wrapper, which is no wider
         than its own contents - so the badge sat next to the title on the LEFT
         instead of at the top right. -->
    <span data-profile-hub-mount></span>
  </header>

  <main class="pc-wrap">
    <p class="pc-intro">Mini courses from your programme. Study the modules, pass the quizzes and the final exam, and earn a printable certificate. Courses open here when your teacher activates them.</p>
    <div id="crsList" class="pc-module-list"></div>
  </main>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<!-- Which university, then start Firebase for it. -->
<script src="js/tenant.js?v=7"></script>
<script src="js/firebase-init.js?v=3"></script>
<script src="student/js/policy-course-content.js?v=7"></script>
<script src="student/js/course-target.js?v=3"></script>
<script>
(function () {
  'use strict';
  // Firebase is started by js/firebase-init.js, which reads the project
  // from js/tenant.js. This file used to name one university directly, which would
  // have pointed every deployment at that same project.
  if (!firebase.apps.length) {
    throw new Error('courses: js/tenant.js + js/firebase-init.js must load first.');
  }
  const auth = firebase.auth();
  const db = firebase.firestore();
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  // ── Course registry ─────────────────────────────────────────
  // Add future courses here: one settings doc + one page each.
  const CATALOG = [
    {
      id: 'ai-guidelines',
      icon: '🎓',
      title: 'AI Use Guidelines',
      desc: 'How artificial intelligence may and may not be used in the English Preparatory Program. 4 modules, a final exam and a certificate.',
      href: 'policy-course.html',
      settingsDoc: 'policyCourse',
      progressCol: 'courseProgress',
      moduleCount: (window.POLICY_COURSE && window.POLICY_COURSE.modules.length) || 4
    }
  ];

  async function boot(user) {
    let userDoc = {};
    try {
      const uSnap = await db.collection('users').doc(user.uid).get();
      userDoc = uSnap.exists ? uSnap.data() : {};
    } catch (_) {}
    document.getElementById('crsStudentChip').textContent = userDoc.name || user.displayName || '';
    const isStaff = userDoc.role === 'teacher' || userDoc.role === 'admin';

    const rows = await Promise.all(CATALOG.map(async c => {
      let cfg = null, prog = null;
      try {
        const s = await db.collection('settings').doc(c.settingsDoc).get();
        cfg = s.exists ? s.data() : null;
      } catch (_) {}
      const active = (typeof window.courseActiveFor === 'function')
        ? window.courseActiveFor(cfg, userDoc) : !!(cfg && cfg.active);
      if (active || isStaff) {
        try {
          const p = await db.collection(c.progressCol).doc(user.uid).get();
          prog = p.exists ? p.data() : null;
        } catch (_) {}
      }
      return { c, active: active || isStaff, prog };
    }));

    const list = document.getElementById('crsList');
    list.innerHTML = rows.map(({ c, active, prog }) => {
      let state, stateCls, action = '';
      if (!active) {
        state = '🔒 Not activated yet'; stateCls = 'off';
      } else if (prog && prog.certificate && prog.certificate.certId) {
        state = '🎓 Certified'; stateCls = 'done';
        // Deep-link straight to the certificate. Without the hash this landed on
        // the course overview and the student had to click "certificate" AGAIN.
        action = `<a class="pc-btn pc-btn-gold" href="${c.href}#certificate">View certificate</a>`;
      } else if (prog) {
        const done = Object.keys(prog.modules || {}).filter(k => (prog.modules[k] || {}).passed).length;
        state = done + ' / ' + c.moduleCount + ' modules'; stateCls = 'on';
        action = `<a class="pc-btn pc-btn-primary" href="${c.href}">Continue</a>`;
      } else {
        state = 'Open'; stateCls = 'on';
        action = `<a class="pc-btn pc-btn-primary" href="${c.href}">Start</a>`;
      }
      return `<div class="pc-module-card crs-card${active ? '' : ' pc-locked'}">
        <div class="pc-module-icon">${c.icon}</div>
        <div class="pc-module-info">
          <div class="pc-module-title">${esc(c.title)}</div>
          <div class="crs-desc">${esc(c.desc)}</div>
        </div>
        <div class="crs-right">
          <span class="crs-state ${stateCls}">${state}</span>
          ${action}
        </div>
      </div>`;
    }).join('');

    document.getElementById('crsLoading').style.display = 'none';
    document.getElementById('crsApp').style.display = '';
  }

  // Leaving the courses area. This was a plain <a href>, so it navigated out
  // instantly and no handler could run - the same trap placement and the
  // policy course had. Warns from the catalog too, before anything is opened,
  // because a course in progress (or a released certificate) is reached from
  // here and leaving is not obviously destructive from the button alone.
  function wireCoursesExit() {
    var b = document.getElementById('crsDashExit');
    if (!b) return;
    b.addEventListener('click', function () {
      var go = function () { window.location.href = 'student-dashboard.html'; };
      var msg = 'Leave courses and go back to the dashboard?';
      if (window.AppDialog && AppDialog.confirm) {
        AppDialog.confirm(msg, { title: 'Leave courses?', okLabel: 'Leave',
                                 cancelLabel: 'Stay', danger: true })
          .then(function (ok) { if (ok) go(); });
      } else if (confirm(msg)) { go(); }
    });
  }
  wireCoursesExit();

  document.addEventListener('DOMContentLoaded', () => {
    auth.onAuthStateChanged(u => {
      if (!u) { window.location.href = 'index.html'; return; }
      boot(u);
    });
  });
})();
</script>
<!-- Profile hub: the avatar picture, and under it the display settings,
     achievements, avatar chooser, password, logout and (for teachers) the
     teacher dashboard. One shared module so all thirteen pages match. -->
<!-- "Rate Lingualab" - before the profile hub, which offers it as a row. -->
<script src="js/app-rating.js?v=3"></script>
<script src="js/faq.js?v=1"></script>
<script src="js/profile-hub.js?v=22"></script>
</body>
</html>
