<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Join your class - Lingualab</title>
  <link rel="icon" href="favicon.ico">
  <style>
    :root { --bg:#0a0f1a; --card:#152035; --card2:#1c2a42; --border:rgba(59,130,246,0.20); --text:#f8fafc; --muted:#94a3b8; --blue:#3b82f6; --green:#22c55e; --amber:#f59e0b; --red:#f87171; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
      background:radial-gradient(1200px 600px at 50% -10%, #16223b 0%, var(--bg) 60%); color:var(--text);
      font-family:'DM Sans','Segoe UI',system-ui,sans-serif; }
    .card { width:100%; max-width:440px; background:var(--card); border:1px solid var(--border); border-radius:18px;
      padding:28px 26px; box-shadow:0 24px 60px rgba(0,0,0,0.45); text-align:center; }
    .badge { font-size:40px; line-height:1; margin-bottom:6px; }
    h1 { font-size:20px; font-weight:800; letter-spacing:-0.3px; margin:6px 0 4px; }
    p { font-size:14px; color:var(--muted); margin:6px 0; line-height:1.5; }
    .class-pill { display:inline-block; margin:12px 0 4px; font-size:26px; font-weight:800; letter-spacing:1px;
      padding:8px 22px; border-radius:14px; background:var(--card2); border:1px solid var(--border); }
    .btn { display:inline-block; margin-top:18px; cursor:pointer; font-family:inherit; font-weight:800; font-size:14px;
      padding:12px 22px; border-radius:12px; border:none; background:var(--blue); color:#fff; text-decoration:none; }
    .btn.ghost { background:transparent; border:1px solid var(--border); color:var(--muted); }
    .ok h1 { color:var(--green); } .warn h1 { color:var(--amber); } .err h1 { color:var(--red); }
    .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%;
      margin:10px auto; animation:spin 0.8s linear infinite; } @keyframes spin { to { transform:rotate(360deg); } }
    .row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="badge">🎓</div>
    <h1>Joining your class</h1>
    <div class="spinner"></div>
    <p>One moment...</p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js" integrity="sha384-yuGdyIzzYtOBlBG6JOWn+Ey9kpq7HocusNuxEGyyohr1eEyXpeEyehIIXC/hznw4" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js" integrity="sha384-lI+CxEx/bCvWP1b0OK13j5HTrTZP7yf1xle8TVOFq2smz6KC1RChTarRV/RHP5PP" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js" integrity="sha384-nwX2Qpkhc2sv6L0ZPkLefLGguao67toSowvePuQvGF6cG+8MUphGI2uI94Ls3JF7" crossorigin="anonymous"></script>
  <script>
    (function () {
      'use strict';
      var firebaseConfig = {
        apiKey: "AIzaSyDmTTictWJmxVxj9frqSODPUjOgpRPPNzU",
        authDomain: "empower-vocabulary-practice.firebaseapp.com",
        projectId: "empower-vocabulary-practice",
        storageBucket: "empower-vocabulary-practice.firebasestorage.app",
        messagingSenderId: "136270199832",
        appId: "1:136270199832:web:174222066ef1cbdc8f576d"
      };
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      var auth = firebase.auth();
      var db = firebase.firestore();

      function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
      function qp(k) { return new URLSearchParams(location.search).get(k) || ''; }
      var classKey = qp('c'), joinCode = qp('k');

      function render(html, cls) {
        var card = document.getElementById('card');
        card.className = 'card' + (cls ? ' ' + cls : '');
        card.innerHTML = html;
      }
      var dashBtn = '<a class="btn" href="student-dashboard.html">Go to my dashboard</a>';

      function show(state) {
        if (state === 'badcode') {
          render('<div class="badge">⚠️</div><h1>Code not recognized</h1><p>This class code is not valid or has changed. Please ask your teacher for the current QR code.</p>', 'warn');
        } else if (state === 'signin') {
          render('<div class="badge">🔑</div><h1>Sign in first</h1><p>Sign in with the email and password you were given, then open this code again.</p><a class="btn" href="index.html">Go to sign in</a>', '');
        }
      }

      function handle(user) {
        if (!classKey || !joinCode) { show('badcode'); return; }
        if (!user) { show('signin'); return; }

        db.collection('classes').doc(classKey).get().then(function (snap) {
          if (!snap.exists) { show('badcode'); return; }
          var c = snap.data() || {};
          if (String(c.joinCode || '') !== String(joinCode)) { show('badcode'); return; }
          var moduleId = c.moduleId || '';
          var code = c.code || classKey;

          return db.collection('enrollments').doc(user.uid + '__' + moduleId).get().then(function (eSnap) {
            if (!eSnap.exists) {
              render('<div class="badge">📋</div><h1>Not on this roster yet</h1>' +
                '<p>We could not find you in <strong>' + esc(moduleId) + '</strong>. Your teacher may not have added you yet. Please check with them.</p>' +
                '<div class="class-pill">' + esc(code) + '</div>' + dashBtn, 'warn');
              return;
            }
            var e = eSnap.data() || {};
            if (String(e.class || '') === String(c.code || '')) {
              render('<div class="badge">✅</div><h1>You are in!</h1>' +
                '<p>You are confirmed in this class' + (e.level ? ' at level <strong>' + esc(e.level) + '</strong>' : '') + '.</p>' +
                '<div class="class-pill">' + esc(code) + '</div>' + dashBtn, 'ok');
            } else {
              render('<div class="badge">↪️</div><h1>Different class</h1>' +
                '<p>This QR is for <strong>' + esc(code) + '</strong>, but you are enrolled in <strong>' + esc(e.class || 'another class') + '</strong>. Use your own class code, or ask your teacher.</p>' + dashBtn, 'warn');
            }
          });
        }).catch(function (err) {
          render('<div class="badge">⚠️</div><h1>Something went wrong</h1><p>' + esc((err && err.message) || 'Please try again.') + '</p>' + dashBtn, 'err');
        });
      }

      auth.onAuthStateChanged(function (user) { handle(user); });
    })();
  </script>
</body>
</html>
